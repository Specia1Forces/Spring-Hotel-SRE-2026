spring.application.name=spring-hotel

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.session.jdbc.initialize-schema=${SESSION_SCHEMA_INITIALIZATION:always}
spring.session.jdbc.continue-on-error=${SESSION_SCHEMA_CONTINUE_ON_ERROR:true}

app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
