apiVersion: batch/v1
kind: Job
metadata:
  name: hotel-migrate
  namespace: hotel
  labels:
    app.kubernetes.io/name: hotel-migrate
    app.kubernetes.io/part-of: spring-hotel
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hotel-migrate
        app.kubernetes.io/part-of: spring-hotel
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: hotel-backend:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --spring.profiles.active=admin-migrate
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: hotel-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: DB_PASSWORD
            - name: LIQUIBASE_ENABLED
              value: "true"
            - name: JPA_SHOW_SQL
              valueFrom:
                configMapKeyRef:
                  name: hotel-config
                  key: JPA_SHOW_SQL
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
